<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="tricolor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <linearGradient id="saffronGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7722" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  
  <!-- App Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#saffronGold)" stroke-width="4" stroke-opacity="0.4" />
  
  <!-- Outer Aura Glow -->
  <circle cx="256" cy="256" r="160" fill="#f97316" opacity="0.08" />
  
  <!-- Central Emblem: Bharat Connect Ring -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="#f97316" stroke-width="12" stroke-linecap="round" stroke-dasharray="160 40" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#22c55e" stroke-width="12" stroke-linecap="round" stroke-dasharray="160 40" stroke-dashoffset="180" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-dasharray="40 160" stroke-dashoffset="90" opacity="0.9" />

  <!-- Ashoka / Connection Hub -->
  <circle cx="256" cy="256" r="54" fill="#020617" stroke="#38bdf8" stroke-width="6" />
  <circle cx="256" cy="256" r="16" fill="#38bdf8" />

  <!-- Spokes representing connecting states -->
  <g stroke="#38bdf8" stroke-width="3" opacity="0.7">
    <line x1="256" y1="202" x2="256" y2="310" />
    <line x1="202" y1="256" x2="310" y2="256" />
    <line x1="218" y1="218" x2="294" y2="294" />
    <line x1="218" y1="294" x2="294" y2="218" />
  </g>

  <!-- Network Nodes -->
  <circle cx="160" cy="180" r="14" fill="#f97316" />
  <circle cx="352" cy="180" r="14" fill="#f97316" />
  <circle cx="160" cy="332" r="14" fill="#22c55e" />
  <circle cx="352" cy="332" r="14" fill="#22c55e" />
</svg>
