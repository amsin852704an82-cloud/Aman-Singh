<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#020617" />
    <title>BharatConnect — You are offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #020617;
        color: #f8fafc;
        padding: 16px;
      }

      .card {
        width: min(92%, 460px);
        padding: 36px 24px;
        text-align: center;
        background: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 20px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
      }

      .icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: rgba(234, 88, 12, 0.15);
        color: #ea580c;
        font-size: 34px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 24px;
        font-weight: 700;
        color: #ffffff;
      }

      p {
        margin: 0 0 24px;
        color: #94a3b8;
        line-height: 1.6;
        font-size: 15px;
      }

      button {
        border: 0;
        border-radius: 12px;
        padding: 12px 24px;
        background: #ea580c;
        color: #ffffff;
        cursor: pointer;
        font-size: 15px;
        font-weight: 600;
        transition: background 0.2s;
      }

      button:hover {
        background: #c2410c;
      }
    </style>
  </head>

  <body>
    <main class="card" role="main">
      <div class="icon" aria-hidden="true">📡</div>

      <h1>You are offline (इंटरनेट बंद है)</h1>

      <p>
        BharatConnect लोड करने के लिए इंटरनेट कनेक्शन चाहिए।
        कनेक्शन रीस्टोर होने पर दोबारा प्रयास करें।
      </p>

      <button type="button" onclick="window.location.reload()">
        Try again (पुनः प्रयास करें)
      </button>
    </main>
  </body>
</html>
